apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-app
  namespace: devops-app

spec:
  replicas: 2

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: devops-app

  template:
    metadata:
      labels:
        app: devops-app

    spec:
      containers:
        - name: devops-app

          image: 194154437225.dkr.ecr.ap-south-1.amazonaws.com/devops-production-dev-app:1.0.1

          ports:
            - containerPort: 5000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 15
            periodSeconds: 20